name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-python/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Compile check
        run: python -m compileall -q app alembic tests
      - name: Tests (SQLite, built by the real migrations)
        run: python -m pytest -q
      - name: Migrations match the models
        env:
          APP_ENV: test
          DATABASE_URL: sqlite:///ci-check.db
        run: |
          python -m alembic upgrade head
          python -m alembic check

  backend-postgres:
    # The ledger relies on row locks and append-only triggers that only Postgres has.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: bf
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend-python
    env:
      APP_ENV: test
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-python/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Upgrade, check, downgrade and upgrade again
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade 0002_phase1_questions_news
          python -m alembic upgrade head
      - name: Ledger and audit tables reject edits
        run: |
          python - <<'PY'
          import os
          import sqlalchemy as sa
          from app.db import normalize_url
          eng = sa.create_engine(normalize_url(os.environ["DATABASE_URL"]))
          with eng.begin() as c:
              c.execute(sa.text("INSERT INTO admin_audit (action, roles, created_at) VALUES ('ci.check', '[]', now())"))
          for stmt in ("UPDATE admin_audit SET action = 'x'", "DELETE FROM admin_audit"):
              try:
                  with eng.begin() as c:
                      c.execute(sa.text(stmt))
              except Exception as exc:
                  assert "append-only" in str(exc), exc
              else:
                  raise SystemExit(f"{stmt!r} was allowed")
          print("append-only triggers enforced")
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE: https://api.example.invalid
