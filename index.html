<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bharat Foreseez</title>
  <meta name="description" content="Forecast real-world outcomes with points. No money, no cash-out.">
  <meta name="theme-color" content="#14171c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bharat Foreseez">
  <link rel="icon" type="image/png" href="%BASE_URL%brand/mark-light.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/src/app/styles.css">
  <!-- Apply the saved theme before first paint so there is no flash. -->
  <script>try{var _t=localStorage.getItem('bf-theme');if(_t==='light'||_t==='dark')document.documentElement.setAttribute('data-theme',_t);}catch(e){}</script>
</head>
<body>
<div class="app-frame" id="appFrame">
  <div class="phone-status">
    <span class="wordmark"><img class="logo-light" src="%BASE_URL%brand/wordmark-light.png" alt="Bharat Foreseez" style=""><img class="logo-dark" src="%BASE_URL%brand/wordmark-dark.png" alt="Bharat Foreseez" style=""></span>
    <div class="ps-right"><button class="theme-toggle" id="btnTheme" aria-label="Toggle light or dark theme" title="Toggle theme"></button><button class="bell-btn" id="btnBell" aria-label="Notifications">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 5-2 6-2 6h16s-2-1-2-6"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="bell-badge" id="notifBadge" hidden>0</span>
    </button></div>
  </div>
  <div class="phone-body" id="phoneBody"></div>
  <div class="phone-nav" id="phoneNav"></div>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet" id="sheet"></div>
</div>
<div id="toastHost"></div>
<script type="module" src="/src/app/main.js"></script>
</body>
</html>
